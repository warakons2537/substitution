html, body { margin: 0; height: 100%; background: #f6f2ee; }
.splash { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-family: "Anuphan", "Leelawadee UI", "Tahoma", sans-serif; color: #7a6a6d; }
.splash img { width: 64px; height: 64px; border-radius: 16px; }

.splash span { font-size: .88rem; }
.splash .bar { width: 120px; height: 4px; border-radius: 99px; background: #eadfd8; overflow: hidden; position: relative; margin-top: 6px; }
.splash .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 99px; background: #d9a531; animation: splash-run 1.1s ease-in-out infinite; }
.splash .suite { margin-top: 18px; font-size: .74rem; letter-spacing: .02em; opacity: .7; }
@keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
@media (prefers-reduced-motion: reduce) { .splash .bar::after { animation: none; width: 100%; opacity: .6; } }
@media (prefers-color-scheme: dark) {
  html, body { background: #151012; } .splash { color: #b3a5a8; } .splash b { color: #f3e3c3; } .splash .bar { background: #3a2d30; }
}
